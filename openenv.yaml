spec_version: 1

name: ConflictBench
type: reinforcement_learning
description: >
  An RL environment for training language models to resolve conflicting
  business instructions by authority. By default the prompt shows senders'
  names and job titles, not the tier list; standing rules, delegations, dates,
  conditions and chains also decide who wins. The reward is deterministic
  (three weighted rubrics plus a format gate, no LLM judge). Includes a GRPO
  training pipeline (Unsloth + TRL) for Qwen2.5 models. No trained-model
  result on the current task has been measured yet.

runtime: python-3.10

# HF Spaces entry point (Gradio demo)
entry_point: app.py

# Training pipeline (python -m training.train_grpo --config configs/<name>.yaml)
training_entry: training/train_grpo.py
training_configs:
  - configs/grpo_smoke.yaml
  - configs/grpo_t4.yaml
  - configs/grpo_a10g.yaml

# Deprecated shim that forwards to training/train_grpo.py
local_training_entry: train_grpo.py

# OpenEnv HTTP / WebSocket server (python -m server.app --port 8000)
server_entry: server/app.py

framework:
  - Unsloth
  - TRL
  - PyTorch
  - PEFT
  - HuggingFace Transformers

environment:
  class: ConflictBenchEnv
  file: conflict_bench.py
  observation: text          # formatted instruction document
  action: text               # JSON resolution plan
  reward_range: [0.0, 1.0]
  reward_type: deterministic
  episode_length: 1          # single step: one prompt, one answer
  difficulty_levels: [1, 2, 3, 4, 5]
  splits: [train, val, test]
  test_set: data/test_v1.jsonl

# Weights must equal verifier.RUBRIC_WEIGHTS (checked by tests/test_docs.py).
reward_rubrics:
  - name: correct_final_state
    weight: 0.45
    type: f1_followed_and_overridden
  - name: conflict_identification
    weight: 0.30
    type: pair_f1_times_resolution_accuracy
  - name: no_contradictions
    weight: 0.25
    type: per_conflict_consistency
reward_format_gate:
  no_answer_found: 0.0
  schema_errors: 0.9
  clean: 1.0
reward_spec: docs/REWARD_DESIGN.md

# Values from configs/*.yaml (checked by tests/test_docs.py).
training:
  method: GRPO
  configs:
    grpo_smoke:
      model: unsloth/Qwen2.5-0.5B-Instruct-bnb-4bit
      lora_rank: 8
      lora_alpha: 8
    grpo_t4:
      model: unsloth/Qwen2.5-3B-Instruct-bnb-4bit
      lora_rank: 16
      lora_alpha: 16
    grpo_a10g:
      model: unsloth/Qwen2.5-3B-Instruct-bnb-4bit
      lora_rank: 16
      lora_alpha: 16

# Measured numbers live in results/ (see results/leaderboard.md); none are copied here.

links:
  hf_space: https://huggingface.co/spaces/Harsh-9209/Conflict_Bench
  hf_model_hackathon_adapter: https://huggingface.co/Harsh-9209/conflictbench-qwen2.5-3b-grpo-lora  # trained on the old task; not re-scored
  github: https://github.com/Harsh-4210/Conflict_Bench
  blog: ./blog.md

metadata:
  version: 2.0.0
  author: Harsh Jain
  competition: OpenEnv Hackathon India 2026
  theme: Long-Horizon Instruction Following  # the hackathon theme it was submitted under; episodes are single-step
  sub_theme: AI Scaling (Scale AI Bonus)
  license: MIT
